## ═══════════════════════════════════════════════════════════════
## openvibe.email — Nginx configuration (REFERENCE)
##
## Installed at /etc/nginx/sites-available/openvibe.email.conf and linked in sites-enabled; the parked-domains.conf
## block for openvibe.email and www.openvibe.email must be removed first, or this vhost never wins the name.
##
## The Mail Node service listens on 127.0.0.1:5250 and serves only JSON. This vhost terminates TLS and is the
## public door:
##
##   /                     the page, with /css/, /js/ and /shared/ for its files
##   /api/v1/              the API; the app enforces Network auth, CORS and the write rules
##   /api/health, /api/ready   the machine answers
##   /auth/                sign-in with OpenVibe.Network (openvibe-sdk/sso): /auth/login, /auth/callback,
##                         /auth/me, /auth/logout. The session cookie is host-only on openvibe.email.
##
## Everything else answers 404. The API body cap is small: a mask label or a purpose, never a message. No nginx
## rate limit is added: the app's 240/minute per address (MAIL_API_RATE_LIMIT_PER_MIN) and the burner counters are
## the limits, and they must see the real client address.
##
## Cloudflare: the host's /etc/nginx/conf.d/cloudflare-realip.conf is included from nginx.conf's http block for
## every vhost; it restores the person's address from CF-Connecting-IP. That is why this file, like the other
## house vhosts, does not repeat the set_real_ip_from list, and why X-Forwarded-For is set to $remote_addr rather
## than $proxy_add_x_forwarded_for. The app runs TRUST_PROXY=2 (Cloudflare + nginx).
## ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.email www.openvibe.email;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.email$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.email;

    ssl_certificate     /etc/letsencrypt/live/openvibe.email/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.email/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.email$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.email;
    include snippets/security-txt.conf;   # /.well-known/security.txt

    ssl_certificate     /etc/letsencrypt/live/openvibe.email/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.email/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.email.access.log;
    error_log  /var/log/nginx/openvibe.email.error.log;

    # The API's JSON body is a label or a purpose; the mail itself never comes through here.
    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/problem+json text/html text/plain;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── the page (server/http/pages.js) and its files ───────
    location = / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:5250;
    }
    location ~ ^/(css|js|shared)/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:5250;
    }

    # ── the machine answers ─────────────────────────────────
    location = /api/health {
        proxy_pass http://127.0.0.1:5250;
    }

    location = /api/ready {
        proxy_pass http://127.0.0.1:5250;
    }

    # ── the API ─────────────────────────────────────────────
    # The app answers the CORS preflight and sets the headers; nginx must not add any of its own.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:5250;
    }

    # ── Network SSO (openvibe-sdk/sso) ──────────────────────
    # The navbar's session probe runs on every page view: it gets the API's budget, not sign-in's.
    location = /auth/me {
        proxy_pass http://127.0.0.1:5250;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:5250;
    }

    # ── everything else ─────────────────────────────────────
    # No generic /api/ proxy: only the paths above are the public API.
    location /api/ { return 404; }
    location ~* ^/(metrics|internal)(/|$) { return 404; }
    location / { return 404; }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
